name: Build LLM Release Action Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'images/llm-action-release/**'
      - 'scripts/**'
      - 'Makefile'
      - '.github/workflows/build-llm-release-action.yaml'
  pull_request:
    branches:
      - main
    paths:
      - 'images/llm-action-release/**'
      - 'scripts/**'
      - 'Makefile'
      - '.github/workflows/build-llm-release-action.yaml'
  schedule:
    - cron: '0 3 * * 0' # Default weekly build on Sundays at 03:00 UTC
  workflow_call:
    inputs:
      tag:
        description: 'Tag for the image'
        type: string
        required: false
        default: 'latest'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag for the image'
        type: string
        required: false
        default: 'latest'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Image
        run: |
          make build FLAVOR=llm-action-release TAG=${{ inputs.tag || 'latest' }}

      - name: Test Image with Goss
        run: |
          make test FLAVOR=llm-action-release TAG=${{ inputs.tag || 'latest' }}

      - name: Push Image
        if: github.event_name != 'pull_request'
        run: |
          make push FLAVOR=llm-action-release TAG=${{ inputs.tag || 'latest' }}
